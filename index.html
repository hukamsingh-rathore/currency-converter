<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="main-container">
    <h1>Currency Converter</h1>
    
    <form id="form-container">
      <div class="amount">
        <label for="amount">Amount:</label>
        <input type="number" id="amount" name="amount" value="1">
      </div>


      <div class="dropdown">
       
        <div class="from">
          <label for="from-currency">From Currency:</label>
          <div class="select-container">
            <img src="https://flagsapi.com/US/flat/64.png" alt="flag">
            <select id="from-currency" name="from">
             
            </select>
          </div>
        </div>

  
        <div class="to">
          <label for="to-currency">To Currency:</label>
          <div class="select-container">
            <img src="https://flagsapi.com/IN/flat/64.png" alt="flag">
            <select id="to-currency" name="to">
             
            </select>
          </div>
        </div>
      </div>

      
      <div class="msg">1 USD = 96.09 INR</div>

     
      <div class="button">
        <button type="submit" id="convert-button">Convert</button>
      </div>
    </form>
  </div>

  
  <script src="codes.js"></script>
  <script src="app.js"></script>
</body>
</html>
